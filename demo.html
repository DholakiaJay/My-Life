 .box
 {
    height: 500px;
    width: 700px;
    background-color: red;
    display: flex;
    justify-content: center;
    align-items: center;
 }
 .child
 {
    height: 50px;
    width:50px;
    background-color: yellow;
    display: flex;
    justify-content: center;
    align-items: center;

 }
 .child:nth-child(1)
 {
    order: 4;
 }
 .child:nth-child(2)
 {
    order: 6;
 }
 .child:nth-child(3)
 {
    order: 5;
 }
 
    </style>

 <div class="box">
    <div class="child">1</div>

    <div class="child">3</div>
