<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <style>/* Basic styles for the navbar */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    
    header {
      background-color: #333;
      padding: 10px 20px;
    }
    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .navbar .logo a {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }
    
    .nav-links {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
    }
    
    .nav-links li {
      margin-left: 20px;
    }
    
    .nav-links li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 8px 16px;
      transition: background-color 0.3s ease;
    }
    
    .nav-links li a:hover {
      background-color: #ddd;
      color: #333;
    }
    
    /* Hamburger Icon */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }
    
    .hamburger span {
      background-color: white;
      height: 3px;
      width: 25px;
      margin: 4px 0;
    }
    
    /* Media Queries for Mobile Devices */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        background-color: #333;
        text-align: center;
      }
    
      .nav-links li {
        margin: 10px 0;
      }
    
      .hamburger {
        display: flex;
      }
    
      .nav-links.active {
        display: flex;
      }
    }
    </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="#">MyLogo</a>
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </header><script>
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
  
    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
  
</body>
</html>
